name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Import project (build class cache)
        run: godot --headless --import || true

      - name: Validate data
        run: godot --headless --path . -s res://tools/validate_data.gd

      - name: Architecture lint
        run: godot --headless --path . -s res://tools/lint_architecture.gd

      - name: Unit + scenario tests
        run: |
          godot --headless --path . -s res://tests/run_tests.gd 2>&1 | tee test.log
          if grep -q "SCRIPT ERROR" test.log; then echo "Script errors detected"; exit 1; fi

  export-windows:
    # Chạy thủ công (Actions > CI > Run workflow) hoặc khi đẩy tag v*.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-windows

      - name: Install Windows export template
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          curl -sL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/windows_release_x86_64.exe -d tpl
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv tpl/windows_release_x86_64.exe ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Export
        run: |
          godot --headless --import || true
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/WorldEconomy.exe

      - uses: actions/upload-artifact@v4
        with:
          name: WorldEconomy-windows
          path: build/windows/
